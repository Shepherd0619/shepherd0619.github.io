name: Build Blog

on:
  push:
    branches:
      - main
    paths:
      - 'blog/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Build blog with 11ty
        run: npm run build:blog

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/index.html blog/posts/
          git diff --staged --quiet || git commit -m "ci: build blog pages [skip ci]"
          git push